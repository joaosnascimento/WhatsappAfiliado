query shopOfferV2(
  $shopId: Long
  $page: Int
  $limit: Int
  $keyword: String
) {
  shopOfferV2(
    shopId: $shopId
    page: $page
    limit: $limit
    keyword: $keyword
  ) {
    nodes {
      shopId
      shopName
      shopType
      commissionRate
      rating
      productCount
      offerLink
    }
    pageInfo {
      page
      limit
      hasNextPage
      totalCount
    }
  }
}
