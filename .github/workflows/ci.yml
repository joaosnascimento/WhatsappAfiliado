name: CI

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee /tmp/typecheck.log
      - name: Report typecheck error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('/tmp/typecheck.log') ? fs.readFileSync('/tmp/typecheck.log', 'utf8') : 'Typecheck failed without a captured log.';
            const fence = String.fromCharCode(96).repeat(3);
            const body = '### CI Typecheck output\\n\\n' + fence + 'text\\n' + log.slice(-10000) + '\\n' + fence;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Build
        run: npm run build
